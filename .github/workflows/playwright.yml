name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://automationexercise.com
      # Optional: if set in repo secrets, bootstrap reuses them; otherwise creates a user
      EMAIL: ${{ secrets.TEST_EMAIL }}
      PASSWORD: ${{ secrets.TEST_PASSWORD }}
      USER_NAME: ${{ secrets.TEST_USER_NAME }}
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Bootstrap test credentials
        run: node scripts/ci-bootstrap-user.js

      - name: Run full Playwright suite
        run: npx playwright test --workers=2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
