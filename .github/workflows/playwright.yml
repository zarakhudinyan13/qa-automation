name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://automationexercise.com
      EMAIL: ${{ secrets.TEST_EMAIL }}
      PASSWORD: ${{ secrets.TEST_PASSWORD }}
      USER_NAME: ${{ secrets.TEST_USER_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        run: npx playwright test --project=api

      - name: Run UI tests
        run: npx playwright test --project=chromium
        if: env.EMAIL != ''

      - name: Run authenticated tests
        run: npx playwright test --project=setup --project=chromium-auth
        if: env.EMAIL != ''

      - name: Run multi-user context examples
        run: npx playwright test --project=examples
        if: env.EMAIL != ''

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
